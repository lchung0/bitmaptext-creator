[package]
name = "bitmapfont-creator"
version = "0.1.0"
edition = "2021"
description = "A CLI tool to create bitmap fonts for Phaser games"
license = "MIT"
authors = ["lchung0"]
repository = "https://github.com/lchung0/bitmaptext-creator"
homepage = "https://github.com/lchung0/bitmaptext-creator"
readme = "README.md"
keywords = [
  "bitmap-font",
  "phaser",
  "game-dev",
  "font-generator",
  "texture-atlas",
]
categories = ["command-line-utilities", "game-development", "graphics"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", default-features = false, features = [
  "derive",
  "std",
  "help",
  "usage",
  "error-context",
] }
thiserror = "2.0"
rectangle-pack = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
